<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P2PRC</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #error { font: 14px monospace; color: #b00; padding: 16px; white-space: pre-wrap; }
    /* The QR is host-drawn; the wasm UI frames it. Centered card, sized so
       the input/link area below stays visible on a phone. */
    .qr { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%);
          z-index: 10; /* the renderer mounts its own tree after these divs */
          background: #fff; padding: 10px; border-radius: 16px;
          box-shadow: 0 8px 30px rgba(0,0,0,.14); }
    .qr img { display: block; width: min(62vw, 300px); height: auto; image-rendering: pixelated; }
    .qr:empty { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="invite-qr" class="qr"></div>
  <div id="answer-qr" class="qr"></div>
  <script src="./runtime/react.production.min.js"></script>
  <script src="./runtime/react-dom.production.min.js"></script>
  <script src="./assets/qrcode.js"></script>
  <script src="./assets/jsqr.js"></script>
  <script src="./assets/qr.js"></script>
  <script type="module">
    import { boot } from "./runtime/boot.js";
    import { Dependencies } from "./app_bridge.js";

    // The host half of the client: WebRTC, localStorage, and the URL. It moves
    // bytes and nothing else — every frame it sends is ciphertext the wasm
    // module produced, and no key material ever crosses this boundary.
    let STUN = [
      { urls: "stun:stun.l.google.com:19302" },
    ];

    let bridge = null;
    // One connection per peer id — an opaque handle the guest chooses — so
    // several conversations can be live at once. Each entry holds its own
    // RTCPeerConnection, data channel, and (during a call) microphone stream.
    const conns = new Map();
    // Where the peer's voice comes out. One element: there is one active call
    // at a time. Autoplay is allowed because the call always follows a user
    // gesture (the call/accept button).
    const remoteAudio = document.createElement("audio");
    remoteAudio.autoplay = true;
    document.body.appendChild(remoteAudio);
    const openingHash = location.hash;   // captured before we ever rewrite it

    // The guest starts asking for things during its first render, which happens
    // inside boot() — before boot() has returned us the bridge to answer on. So
    // callbacks queue until the bridge exists, then drain in order.
    const queued = [];
    // Render right after any host callback. A state change that arrives from
    // the network has nothing to repaint it otherwise, and neither timer is
    // dependable: requestAnimationFrame is paused outright in a hidden tab,
    // and Chrome throttles intervals to once a minute once a tab has been
    // hidden a while. Rendering in the same task as the event sidesteps both.
    function render() {
      if (!bridge) return;
      try { bridge.uuiRender(); } catch (err) { console.warn("[p2prc] render", err); }
    }

    function withBridge(fn) {
      if (!bridge) { queued.push(fn); return; }
      fn(bridge);
      render();
    }
    const emit = (kind, payload) =>
      withBridge((b) => b.p2prcEvent(kind, String(payload)));
    const done = (id, ok, payload) => {
      if (!id) return;
      withBridge((b) => b.p2prcRequestComplete(id, ok, String(payload)));
    };

    // --- Compact encoding: SDP is repetitive text, so it gzips well. ---
    const b64url = (bytes) => btoa(String.fromCharCode(...bytes))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    const unb64url = (text) => {
      let s = text.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    };
    async function pack(text) {
      const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
      return "z" + b64url(new Uint8Array(await new Response(stream).arrayBuffer()));
    }
    async function unpack(blob) {
      const clean = String(blob).trim().replace(/^.*#[oa]=/, "").replace(/\s+/g, "");
      const bytes = unb64url(clean.slice(1));
      if (clean[0] === "r") return new TextDecoder().decode(bytes);
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      return await new Response(stream).text();
    }

    /// Trims SDP to what a data channel needs — smaller QR, easier scan. The
    /// trailing CRLF is required: without it the last attribute is unterminated
    /// and strict parsers reject the whole description.
    const slim = (sdp) => sdp.split("\r\n")
      .filter((l) => l !== "" && !(l.startsWith("a=candidate:") && l.includes(" tcp ")))
      .join("\r\n") + "\r\n";

    const gathered = (pc) => new Promise((resolve) => {
      if (pc.iceGatheringState === "complete") return resolve();
      // Don't wait forever on a candidate that may never arrive.
      const timer = setTimeout(resolve, 3000);
      pc.addEventListener("icegatheringstatechange", () => {
        if (pc.iceGatheringState === "complete") { clearTimeout(timer); resolve(); }
      });
    });

    // Once the link is up the codes are noise, and on the answering side they
    // would otherwise cover the conversation. `connected` also suppresses a
    // late draw: the answer QR is rendered right around the moment the channel
    // opens, so clearing alone can lose the race.
    let connected = false;
    const clearQR = () => {
      connected = true;
      for (const id of ["invite-qr", "answer-qr"]) {
        const el = document.getElementById(id);
        if (el) el.replaceChildren();
      }
    };

    function wire(peer, dc) {
      const entry = conns.get(peer);
      if (entry) entry.channel = dc;
      // A channel handed over by `ondatachannel` can already be open, in which
      // case `onopen` never fires.
      if (dc.readyState === "open") { clearQR(); emit("open", peer); }
      dc.onopen = () => { clearQR(); emit("open", peer); };
      dc.onmessage = (e) => emit("frame", peer + " " + e.data);
      dc.onclose = () => emit("state", peer + " disconnected");
    }

    function closeEntry(peer) {
      const entry = conns.get(peer);
      if (!entry) return;
      conns.delete(peer);
      if (entry.localStream) for (const t of entry.localStream.getTracks()) t.stop();
      if (entry.channel) { try { entry.channel.close(); } catch (e) {} }
      try { entry.pc.close(); } catch (e) {}
    }

    function newConnection(peer) {
      closeEntry(peer);
      const pc = new RTCPeerConnection({ iceServers: STUN });
      conns.set(peer, { pc, channel: null, localStream: null });
      pc.onconnectionstatechange = () => emit("state", peer + " " + pc.connectionState);
      pc.ondatachannel = (e) => wire(peer, e.channel);
      pc.ontrack = (e) => { remoteAudio.srcObject = e.streams[0] || new MediaStream([e.track]); };
      return pc;
    }

    // Simulate a network drop for testing reconnection: closing the peer
    // connections is exactly what a WiFi→cellular switch does to the ICE
    // path. Exposes nothing a user can't already do by closing the tab.
    window.__p2prcDropConnection = () => {
      for (const [peer, entry] of conns) {
        if (entry.channel) { try { entry.channel.close(); } catch (e) {} }
        try { entry.pc.close(); } catch (e) {}
        emit("state", peer + " failed");
      }
    };
    window.__p2prcState = () => Object.fromEntries(
      [...conns].map(([peer, e]) => [peer, {
        pc: e.pc.connectionState, ice: e.pc.iceConnectionState,
        sig: e.pc.signalingState, chan: e.channel && e.channel.readyState,
      }])
    );

    // The same-origin return path: another tab in this browser receives the
    // answer with no user action. Cross-device pairing uses the reply QR.
    // Two tabs of one origin share localStorage, so without this they would
    // boot the *same* identity — and a peer cannot form a group with itself.
    // The first live tab keeps the durable identity; any further tab gets its
    // own, which is also the honest model: two tabs are two participants.
    // A heartbeat marks the durable slot as taken; a stale mark is reclaimable,
    // so closing the tab doesn't strand the identity forever.
    const CLAIM = "p2prc:claim", BEAT = 1000, STALE = 3000;
    function claimSlot() {
      const existing = sessionStorage.getItem("p2prc:slot");
      if (existing) return existing;
      let slot = "identity:" + Math.random().toString(36).slice(2, 10);
      const held = Number(localStorage.getItem(CLAIM) || 0);
      if (Date.now() - held > STALE) slot = "identity";
      sessionStorage.setItem("p2prc:slot", slot);
      return slot;
    }
    const SLOT = claimSlot();
    if (SLOT === "identity") {
      const beat = () => localStorage.setItem(CLAIM, String(Date.now()));
      beat();
      setInterval(beat, BEAT);
    }
    const scoped = (key) => "p2prc:" + (key === "identity" ? SLOT : key);

    const relay = new BroadcastChannel("p2prc-pair");
    relay.onmessage = (e) => {
      if (e.data && e.data.kind === "answer") emit("answer", e.data.blob);
    };

    const host = {
      async createOffer(requestID, peer) {
        try {
          const c = newConnection(peer);
          wire(peer, c.createDataChannel("p2prc", { ordered: true }));
          await c.setLocalDescription(await c.createOffer());
          await gathered(c);
          done(requestID, true, await pack(slim(c.localDescription.sdp)));
        } catch (err) { done(requestID, false, err.message); }
      },
      async acceptOffer(requestID, peer, blob) {
        try {
          const c = newConnection(peer);
          await c.setRemoteDescription({ type: "offer", sdp: await unpack(blob) });
          await c.setLocalDescription(await c.createAnswer());
          await gathered(c);
          done(requestID, true, await pack(slim(c.localDescription.sdp)));
        } catch (err) { done(requestID, false, err.message); }
      },
      async acceptAnswer(requestID, peer, blob) {
        try {
          const entry = conns.get(peer);
          if (!entry) return done(requestID, false, "no connection");
          await entry.pc.setRemoteDescription({ type: "answer", sdp: await unpack(blob) });
          done(requestID, true, "");
        } catch (err) { emit("error", err.message); }
      },
      sendFrame(peer, text) {
        const entry = conns.get(peer);
        if (entry && entry.channel && entry.channel.readyState === "open") entry.channel.send(text);
      },
      closeConnection(peer) { closeEntry(peer); },
      setIceServers(json) {
        try {
          // Entries are { urls, username?, credential? }: STUN bare, TURN
          // with the credentials a relay minted for us. (Older guests sent
          // bare URL strings; accept those too.)
          const entries = JSON.parse(json);
          if (Array.isArray(entries) && entries.length) {
            STUN = entries.map((e) => typeof e === "string" ? { urls: e } : e);
          }
        } catch (e) {}
      },
      // --- Calls: audio on the same pc, renegotiated over the channel. ----
      async callStart(requestID, peer) {
        try {
          const entry = conns.get(peer);
          if (!entry) return done(requestID, false, "");
          entry.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          for (const track of entry.localStream.getTracks()) entry.pc.addTrack(track, entry.localStream);
          const offer = await entry.pc.createOffer();
          await entry.pc.setLocalDescription(offer);
          await gathered(entry.pc);
          done(requestID, true, entry.pc.localDescription.sdp);
        } catch (err) { done(requestID, false, ""); }
      },
      async callApplyRemote(requestID, peer, sdp, isOffer) {
        try {
          const entry = conns.get(peer);
          if (!entry) return done(requestID, false, "");
          if (isOffer && !entry.localStream) {
            entry.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            for (const track of entry.localStream.getTracks()) entry.pc.addTrack(track, entry.localStream);
          }
          await entry.pc.setRemoteDescription({ type: isOffer ? "offer" : "answer", sdp });
          if (!isOffer) return done(requestID, true, "");
          const answer = await entry.pc.createAnswer();
          await entry.pc.setLocalDescription(answer);
          await gathered(entry.pc);
          done(requestID, true, entry.pc.localDescription.sdp);
        } catch (err) { done(requestID, false, ""); }
      },
      callEnd(peer) {
        const entry = conns.get(peer);
        if (!entry) return;
        if (entry.localStream) {
          for (const track of entry.localStream.getTracks()) track.stop();
          entry.localStream = null;
        }
        for (const sender of entry.pc.getSenders()) {
          if (sender.track) { try { entry.pc.removeTrack(sender); } catch (e) {} }
        }
        remoteAudio.srcObject = null;
      },
      save(key, value) { localStorage.setItem(scoped(key), value); },
      load(requestID, key) { done(requestID, true, localStorage.getItem(scoped(key)) || ""); },
      pageURL(requestID) { done(requestID, true, location.origin + location.pathname); },
      openingHash(requestID) { done(requestID, true, openingHash); },
      setHash(value) { history.replaceState(null, "", "#" + value); },
      publishAnswer(blob) { relay.postMessage({ kind: "answer", blob: blob }); },
      // --- Networking stack ---------------------------------------------
      //
      // Mechanical only. No decisions live here: the guest picks which
      // bootstrapper to ask, in what order, and whether to fall back to a
      // public STUN server at all. This side just moves bytes and answers
      // honestly about what it can do.
      capabilities(requestID) {
        done(requestID, true, JSON.stringify({
          // A tab has no listening socket. This single fact is what makes it
          // a consumer of the network rather than a sustainer of it.
          acceptsInbound: false,
          servesHTTP: false,
          discoversAddress: true,
        }));
      },
      async httpGet(requestID, url) {
        try {
          const response = await fetch(url, { mode: "cors" });
          done(requestID, response.ok, response.ok ? await response.text() : "");
        } catch (err) { done(requestID, false, ""); }
      },
      delay(requestID, ms) { setTimeout(() => done(requestID, true, ""), ms); },
      async stunLookup(requestID, server) {
        try {
          const c = new RTCPeerConnection({ iceServers: [{ urls: "stun:" + server }] });
          c.createDataChannel("probe");
          await c.setLocalDescription(await c.createOffer());
          await gathered(c);
          const line = (c.localDescription.sdp.split("\r\n")
            .find((l) => l.includes("typ srflx")) || "").split(" ");
          c.close();
          done(requestID, line.length > 5, line.length > 5 ? line[4] + ":" + line[5] : "");
        } catch (err) { done(requestID, false, ""); }
      },
      startServer(requestID) {
        done(requestID, false, "");
      },
      publishDirectory() {},
      // A browser tab holds no Cloudflare key and cannot serve /turn, so it
      // brokers no relay of its own and reports no spend — it only consumes
      // credentials other peers broker.
      localTURN(requestID) { done(requestID, true, ""); },
      relaySpend(requestID) { done(requestID, true, ""); },

      share(text) {
        if (navigator.share) { navigator.share({ text }).catch(() => {}); return; }
        navigator.clipboard?.writeText(text).catch(() => {});
      },
      // A QR from a picture, decoded entirely in this tab. The file input
      // is the web's camera bridge: on a phone `capture` opens the camera,
      // on a laptop it opens the picker. BarcodeDetector where the browser
      // has one (Chrome), jsQR everywhere else (Safari).
      scanQR(requestID) {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.capture = "environment";
        input.style.display = "none";
        document.body.appendChild(input);
        const finish = (ok, text) => { input.remove(); done(requestID, ok, text || ""); };
        input.onchange = async () => {
          const file = input.files && input.files[0];
          if (!file) return finish(false, "");
          try {
            const bitmap = await createImageBitmap(file);
            if ("BarcodeDetector" in window) {
              try {
                const found = await new BarcodeDetector({ formats: ["qr_code"] }).detect(bitmap);
                if (found.length) return finish(true, found[0].rawValue);
              } catch (e) { /* fall through to jsQR */ }
            }
            // Downscale for jsQR: huge camera frames are slow and no more
            // decodable than 1200px ones.
            const scale = Math.min(1, 1200 / Math.max(bitmap.width, bitmap.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(bitmap.width * scale);
            canvas.height = Math.round(bitmap.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const hit = window.jsQR && window.jsQR(data.data, canvas.width, canvas.height);
            finish(!!hit, hit ? hit.data : "");
          } catch (err) { finish(false, ""); }
        };
        // If the picker is dismissed nothing fires; reclaim on refocus.
        window.addEventListener("focus", () => {
          setTimeout(() => { if (!input.files || !input.files.length) finish(false, ""); }, 1200);
        }, { once: true });
        input.click();
      },
      saveQR(elementID) {
        const img = document.querySelector("#" + elementID + " img");
        if (!img) return;
        const link = document.createElement("a");
        link.href = img.src;
        link.download = "p2prc-invite.png";
        link.click();
      },

      drawQR(elementID, text) {
        if (connected) return;
        const el = document.getElementById(elementID);
        if (!el) return;
        // Empty text means "clear it" — the client sends this when a pairing
        // is cancelled, so the code doesn't linger over the start screen.
        if (!text) { el.replaceChildren(); return; }
        if (window.P2PRCQR) window.P2PRCQR.draw(el, text);
      },
    };

    boot({
      canvas: document.getElementById("canvas"),
      // Local development serves without cache headers, and a stale cached
      // module quietly runs old client logic against new HTML. Bust it there;
      // the published site relies on normal HTTP caching.
      wasmURL: "./app.wasm" + (location.hostname === "localhost" ? "?t=" + Date.now() : ""),
      rendererName: new URLSearchParams(location.search).get("renderer") || "react",
      dependencies: { host: Dependencies.p2PRCHost(() => host) },
    }).then((result) => {
      bridge = result.bridge;
      while (queued.length) queued.shift()(bridge);
      // Drive the renderer every frame.
      //
      // State here changes from host callbacks — a WebRTC channel opening, a
      // frame arriving, a peer's answer landing — all of which happen outside
      // the renderer's own event loop, and none of which schedule a repaint.
      // Without this the model updates correctly and the screen never moves,
      // which looks exactly like a hang. Rendering is diff-then-patch, so an
      // idle frame costs a tree walk and no DOM work.
      // A steady frame loop for animation and text input while visible; the
      // per-event render above is what keeps a backgrounded tab correct.
      (function frame() { render(); requestAnimationFrame(frame); })();
    }).catch((error) => {
      console.error(error);
      const pre = document.createElement("pre");
      pre.id = "error";
      pre.textContent = String(error.stack || error);
      document.body.replaceChildren(pre);
    });
  </script>
</body>
</html>
